name: SMA Agent CI Diagnosis Lab
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pricing-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run diagnostic tests (expected failure)
        run: python -m pytest -q tests/test_pricing.py
